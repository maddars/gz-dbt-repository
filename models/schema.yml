version: 2

sources:
  - name: raw
    schema: gz_raw_data
    tables:

      - name: raw_gz_adwords
        description: adwords campaign

      - name: raw_gz_bing
        description: bing campaign

      - name: raw_gz_criteo
        description: criteo campaign

      - name: raw_gz_facebook
        description: facebook campaign

      - name: sales
        identifier: raw_gz_sales
        description: sales of greenweez
        columns:
          - name: date_date
            description: date of purchase
          - name: orders_id
            description: foreign key to ship
          - name: pdt_id
            description: foreign key to product
          - name: revenue
            description: amount paid by the customer
          - name: quantity
            description: quantity
        tests:
          - unique:
              column_name: "(orders_id || '-' || pdt_id)"

      - name: product
        identifier: raw_gz_product
        description: product of greenweez
        columns:
          - name: products_id
            description: primary key
          - name: purchase_price
            description: purchase price

      - name: ship
        identifier: raw_gz_ship
        columns:
          - name: orders_id
            description: primary key of orders
          - name: shipping_fee
            description: shipping fee
          - name: log_cost
            description: preparation cost
          - name: ship_cost
            description: shipping cost


models:

  - name: stg_raw__ship
    description: clean ship table
    tests:
      - unique:
          column_name: orders_id
      - not_null:
          column_name: orders_id

  - name: stg_raw__product
    description: clean product table
    tests:
      - unique:
          column_name: products_id
      - not_null:
          column_name: products_id

  - name: int_orders_margin
    description: margin calculation per order
    columns:
      - name: order_id
        description: primary key
      - name: margin
        description: Margin = Revenue - Purchase_cost

  - name: int_sales_margin
    description: margin calculation per order line
    columns:
      - name: margin
        description: Margin = Revenue - Purchase_cost

  - name: int_orders_operational
    description: operational margin per order
    columns:
      - name: operational_margin
        description: margin + shipping fee - log_cost - ship_cost

  - name: finance_days
    description: finance calculation per day